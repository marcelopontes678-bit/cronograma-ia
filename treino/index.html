<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Treino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0d0d0f;
  --surface: #17171b;
  --surface2: #1f1f24;
  --border: #2a2a2e;
  --text: #ededf0;
  --muted: #8a8a90;
  --accent: #ff6b35;
  --accent2: #ff8a5c;
  --blue: #4a9eff;
  --green: #3ecf8e;
  --red: #ff5c5c;
  --yellow: #f5c842;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  outline: none;
  font-size: 14px;
  width: 100%;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: #55555c; }

.mono { font-family: 'IBM Plex Mono', monospace; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 5;
  background: rgba(13,13,15,0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 16px 18px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title-wrap { display: flex; align-items: baseline; gap: 8px; }
.app-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; }
.app-badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 1.5px;
  color: var(--accent); border: 1px solid var(--accent); padding: 2px 5px; border-radius: 3px; text-transform: uppercase;
}
.header-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

/* Main */
main#main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 16px 16px 110px; }

/* Bottom nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
  display: flex;
  background: rgba(15,15,17,0.97);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 0 8px; background: none; border: none; color: var(--muted);
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
}
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn.active { color: var(--accent); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px 18px; border-radius: 9px; border: 1px solid transparent;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #17100c; font-weight: 600; }
.btn-primary:hover { background: var(--accent2); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--muted); color: var(--text); }
.btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
.btn-danger:hover { background: var(--red); color: #200; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 10px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; color: var(--muted);
}
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover { color: var(--text); border-color: var(--muted); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.card + .card { margin-top: 12px; }
.card-pad { padding: 16px; }

.section-title {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); margin: 22px 0 10px;
}
.section-title:first-child { margin-top: 0; }

/* Empty state */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--muted); font-size: 13px; text-align: center; padding: 50px 20px; opacity: .7;
}
.empty svg { opacity: .35; }

/* Routine card */
.routine-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.routine-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.routine-name { font-size: 15px; font-weight: 600; }
.routine-ex-list { font-size: 12px; color: var(--muted); line-height: 1.6; }
.routine-actions { display: flex; gap: 8px; }

/* Stats row */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
.stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; }
.stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--accent); letter-spacing: 1px; }
.stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

/* Active workout */
.workout-timer-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
}
.workout-timer-time { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--accent); letter-spacing: 1px; }
.workout-timer-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.workout-actions { display: flex; gap: 8px; }

.ex-card { margin-bottom: 14px; }
.ex-card-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
.ex-card-title { font-size: 14.5px; font-weight: 600; }
.ex-card-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: .5px; margin-top: 2px; }

.set-table { padding: 8px 12px 12px; }
.set-row-header, .set-row {
  display: grid; grid-template-columns: 32px 1fr 64px 56px 38px; gap: 6px; align-items: center; padding: 6px 4px;
}
.set-row-header { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; text-align: center; }
.set-row { border-radius: 8px; }
.set-row.completed { background: rgba(62,207,142,0.08); }
.set-row.warmup .set-num-btn { color: var(--yellow); border-color: var(--yellow); }
.set-num-btn {
  width: 28px; height: 28px; border-radius: 7px; background: var(--surface2); border: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text); display: flex; align-items: center; justify-content: center;
}
.set-prev { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); text-align: center; }
.set-input { text-align: center; padding: 8px 4px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
.set-check {
  width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface2);
  display: flex; align-items: center; justify-content: center; color: var(--muted);
}
.set-check.on { background: var(--green); border-color: var(--green); color: #06200f; }
.set-check svg { width: 16px; height: 16px; }
.pr-badge { color: var(--yellow); font-size: 11px; margin-left: 4px; }

.add-set-btn { margin: 6px 4px 2px; }
.ex-card-menu-btn { background: none; border: none; color: var(--muted); padding: 4px; }

/* Rest timer floating bar */
.rest-bar {
  position: fixed; left: 12px; right: 12px; bottom: calc(64px + env(safe-area-inset-bottom));
  z-index: 7; background: var(--surface2); border: 1px solid var(--accent); border-radius: 12px;
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.rest-bar-left { display: flex; align-items: center; gap: 10px; }
.rest-bar-time { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--accent); min-width: 54px; }
.rest-bar-actions { display: flex; gap: 6px; }
.rest-bar-actions button {
  background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 7px;
  padding: 6px 9px; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
}

/* Exercise list */
.chip-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface);
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .5px; color: var(--muted); text-transform: uppercase;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #17100c; font-weight: 600; }

.ex-list-item {
  display: flex; align-items: center; justify-content: space-between; padding: 13px 16px;
  border-bottom: 1px solid var(--border);
}
.ex-list-item:last-child { border-bottom: none; }
.ex-list-name { font-size: 14px; font-weight: 500; }
.ex-list-muscle { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: .5px; }
.ex-list-check { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
.ex-list-check.on { background: var(--accent); border-color: var(--accent); }
.ex-list-check svg { width: 13px; height: 13px; color: #17100c; }

/* History */
.history-card { padding: 15px 16px; }
.history-head { display: flex; align-items: center; justify-content: space-between; }
.history-name { font-size: 15px; font-weight: 600; }
.history-date { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
.history-meta { display: flex; gap: 14px; margin-top: 10px; }
.history-meta-item { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.history-ex-line { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-sheet {
  background: var(--bg); border: 1px solid var(--border); border-bottom: none; border-radius: 18px 18px 0 0;
  width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  animation: slideUp .22s ease both;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; margin-bottom: 14px; }
.modal-close { position: absolute; top: 14px; right: 14px; }
.field-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: block; margin: 12px 0 6px; }
.field-label:first-child { margin-top: 0; }
.modal-footer { display: flex; gap: 10px; margin-top: 18px; }
.search-box { margin-bottom: 12px; }

/* Detail / chart */
.pr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.chart-wrap { padding: 14px 10px; }
.set-history-row { display: flex; justify-content: space-between; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.set-history-row:last-child { border-bottom: none; }
.set-history-date { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

/* toggle switch */
.toggle-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; row-gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--border); }
.toggle-row:last-child { border-bottom: none; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.seg button { padding: 6px 10px; background: var(--surface2); border: none; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); }
.seg button.on { background: var(--accent); color: #17100c; font-weight: 600; }

.toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 30;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 20px;
  font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.4); animation: fadeInOut 2.4s ease both;
}
@keyframes fadeInOut { 0% { opacity: 0; transform: translate(-50%,8px); } 12%,80% { opacity: 1; transform: translate(-50%,0); } 100% { opacity: 0; transform: translate(-50%,-6px); } }

@media (min-width: 700px) {
  .set-row-header, .set-row { grid-template-columns: 40px 1fr 80px 64px 42px; }
}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="app-title-wrap"><span class="app-title">TREINO</span><span class="app-badge">Log</span></div>
    <div class="header-sub" id="headerSub">Diário de treino</div>
  </div>
  <button class="icon-btn" id="btnQuickTimer" title="Timer de descanso">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
  </button>
</div>

<main id="main"></main>
<div id="restBarRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<div class="bottom-nav">
  <button class="nav-btn" data-tab="treino" onclick="setTab('treino')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5l11 11M20.5 8.5l-3-3a1.5 1.5 0 0 0-2.1 0l-1 1a1.5 1.5 0 0 0 0 2.1l3 3a1.5 1.5 0 0 0 2.1 0l1-1a1.5 1.5 0 0 0 0-2.1zM8.6 15.4l-3 3a1.5 1.5 0 0 1-2.1 0l-1-1a1.5 1.5 0 0 1 0-2.1l3-3"/></svg>
    Treino
  </button>
  <button class="nav-btn" data-tab="historico" onclick="setTab('historico')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Histórico
  </button>
  <button class="nav-btn" data-tab="exercicios" onclick="setTab('exercicios')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V6M9 19V3M14 19v-9M19 19V9"/></svg>
    Exercícios
  </button>
  <button class="nav-btn" data-tab="perfil" onclick="setTab('perfil')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    Perfil
  </button>
</div>

<script src="app.js"></script>
</body>
</html>
