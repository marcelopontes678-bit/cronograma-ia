# Ambiente local completo: Postgres + API.  Uso: ANTHROPIC_API_KEY=... docker compose up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pauta
      POSTGRES_PASSWORD: pauta
      POSTGRES_DB: pauta
    volumes: [dados:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pauta"]
      interval: 3s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://pauta:pauta@db:5432/pauta
      SECRET_KEY: troque-esta-chave-local-por-uma-com-32-caracteres
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
volumes:
  dados:
