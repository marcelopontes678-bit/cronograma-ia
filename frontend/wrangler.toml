# Config do Worker Cloudflare para este frontend Next.js, via
# @cloudflare/next-on-pages (npm run pages:build gera .vercel/output/static,
# incluindo o worker _worker.js/index.js que serve as rotas dinamicas/Edge).
# Formato "Workers" (main + binding de assets), nao o formato classico do
# Cloudflare Pages (pages_build_output_dir) -- este projeto foi criado no
# dashboard como um Worker (Workers Builds), nao como um Pages project.
#
# Nao confundir com o wrangler.jsonc na raiz do monorepo, que e de um Worker
# diferente e nao relacionado (o app GIBOR em treino/). Este arquivo so deve
# ser lido quando o comando `wrangler deploy` roda com cwd = frontend/
# (campo "Path" do passo de deploy no dashboard do Cloudflare precisa estar
# como "frontend", senao ele cai no wrangler.jsonc da raiz por engano).
name = "smartfactory-frontend"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".vercel/output/static/_worker.js/index.js"

[assets]
directory = ".vercel/output/static"
binding = "ASSETS"
