<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Clawd — Decolagem</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; }
      #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080" data-no-timeline>
      <canvas id="film" width="1920" height="1080"></canvas>
      <audio id="soundtrack" src="assets/soundtrack.wav" data-start="0" data-duration="20" data-volume="1"></audio>
    </div>
    <script type="module">
      import { createFilm } from './src/main.js';
      const film = createFilm(document.getElementById('film'));
      window.__renderAt = film.renderAt;
      window.addEventListener('hf-seek', (e) => film.renderAt(e.detail.time));
      film.renderAt(window.__hfThreeTime || 0);
      window.__clawdReady = true;
    </script>
  </body>
</html>
