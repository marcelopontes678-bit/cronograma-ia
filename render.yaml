databases:
  - name: cronograma-ia-db
    databaseName: smartfactory
    user: smartfactory
    plan: free

services:
  - type: web
    name: cronograma-ia-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    dockerCommand: "./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cronograma-ia-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
