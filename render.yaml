databases:
  - name: cronograma-ia-db
    databaseName: smartfactory
    user: smartfactory
    plan: free
  # Banco próprio do Pauta (separado do backend para as tabelas não colidirem).
  - name: pauta-db
    databaseName: pauta
    user: pauta
    plan: free

services:
  - type: web
    name: cronograma-ia-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    dockerCommand: "./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cronograma-ia-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Triagem de currículos com IA (tela web). Ver triagem-curriculos/README.md.
  - type: web
    name: triagem-curriculos
    runtime: docker
    rootDir: triagem-curriculos
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/saude
    buildFilter:
      paths:
        - triagem-curriculos/**
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Senha de acesso à tela (qualquer usuário + esta senha). Obrigatória:
      # sem ela o app responde 503, para ninguém gastar a chave da API.
      - key: TRIAGEM_SENHA
        sync: false
      - key: TRIAGEM_EXIGIR_SENHA
        value: "1"

  # Pauta — planejador de conteúdo com IA. Ver planejador-conteudo/README.md.
  - type: web
    name: pauta
    runtime: docker
    rootDir: planejador-conteudo
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/saude
    buildFilter:
      paths:
        - planejador-conteudo/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pauta-db
          property: connectionString
      - key: AMBIENTE
        value: producao
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAUTA_LIMITE_PLANOS
        value: "10"
      - key: WEB_CONCURRENCY
        value: "2"
